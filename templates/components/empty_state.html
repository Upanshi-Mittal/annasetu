<!-- Component: Empty State -->
<div class="py-16 px-4 text-center space-y-4 max-w-md mx-auto">
    <div class="w-16 h-16 mx-auto rounded-3xl bg-stone-100 dark:bg-night-800 flex items-center justify-center text-stone-400">
        <i data-lucide="{{ icon|default:'inbox' }}" class="w-8 h-8"></i>
    </div>
    <div class="space-y-1">
        <h4 class="font-serif font-bold text-lg text-stone-900 dark:text-stone-100">{{ title|default:"Nothing here yet" }}</h4>
        <p class="text-xs text-stone-500 leading-relaxed">{{ message|default:"Check back soon or try adjusting your filters." }}</p>
    </div>
    {% if action_url %}
    <div>
        <a href="{{ action_url }}" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold text-white bg-leaf-600 hover:bg-leaf-700 shadow-sm transition-all">
            {{ action_label|default:"Get Started" }}
        </a>
    </div>
    {% endif %}
</div>
