<!-- Component: Badge -->
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold
    {% if type == 'urgent' or type == 'danger' %}
        bg-red-100 text-red-800 dark:bg-red-950/60 dark:text-red-300 border border-red-200 dark:border-red-800
    {% elif type == 'success' or type == 'delivered' %}
        bg-green-100 text-green-800 dark:bg-green-950/60 dark:text-green-300 border border-green-200 dark:border-green-800
    {% elif type == 'warning' or type == 'claimed' %}
        bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200 dark:border-amber-800
    {% else %}
        bg-stone-100 text-stone-800 dark:bg-stone-800 dark:text-stone-300 border border-stone-200 dark:border-stone-700
    {% endif %}">
    {{ label }}
</span>
